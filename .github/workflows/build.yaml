name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: ics-converter.exe
            asset_name: ics-converter-windows.exe
          - os: macos-latest
            artifact_name: ics-converter
            asset_name: ics-converter-mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: cargo build --release

      - name: Copy binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p "ICS Converter.app/Contents/MacOS"
          mkdir -p "ICS Converter.app/Contents/Resources"
          cp target/release/ics-converter "ICS Converter.app/Contents/MacOS/"
          cp Info.plist "ICS Converter.app/Contents/"
          tar -czf ${{ matrix.asset_name }}.tar.gz "ICS Converter.app"

      - name: Copy binary (Windows)
        if: matrix.os == 'windows-latest'
        run: copy target\release\${{ matrix.artifact_name }} ${{ matrix.asset_name }}
        shell: cmd

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}
